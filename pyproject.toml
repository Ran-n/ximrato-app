[project]
name = "ximrato-app"
version = "0.1.0"
description = "Cross-platform fitness logger frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet>=0.27.0",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]
