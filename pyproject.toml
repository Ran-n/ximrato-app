[project]
name = "ximrato-app"
version = "0.2.3"
description = "Cross-platform fitness logger frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["flet>=0.27.0", "httpx>=0.28.0", "python-dotenv>=1.0.0"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.flet]
org = "com.ximrato"
product = "Ximrato"
copyright = "© 2026 Ran#"

[tool.flet.app]
icon = "assets/icon.png"

exclude = [
    ".venv",
    ".git",
    "tests",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    "*.egg-info",
    "uv.lock",
    ".python-version",
    ".env",
    ".env.example",
]

[tool.flet.splash]
color = "#1A1A1A"
dark_color = "#1A1A1A"
web = true
ios = true
android = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[dependency-groups]
dev = [
    "flet-cli>=0.27.0",
    "flet-desktop>=0.27.0",
    "pytest>=9.0.2",
    "pytest-playwright>=0.7.2",
    "ruff>=0.15.7",
]
