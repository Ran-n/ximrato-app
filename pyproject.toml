[project]
name = "ximrato-app"
version = "0.2.2"
description = "Cross-platform fitness logger frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet>=0.27.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.flet.app]
exclude = [".venv", ".git", "tests", "build", ".pytest_cache", ".ruff_cache", "*.egg-info", "uv.lock", ".python-version", ".env", ".env.example"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "flet-cli>=0.27.0",
    "flet-desktop>=0.27.0",
    "pytest>=9.0.2",
    "pytest-playwright>=0.7.2",
    "ruff>=0.15.7",
]
